# PPS support for the GNSS TIMEPULSE on Verdin SODIMM 64.
#
# CONFIG_PPS_CLIENT_GPIO is requested as built-in, but the Toradex BSP's
# torizon-kernel-meta features/spi/spi.cfg sets it to =m and wins the merge, so
# the driver ships as a module.  The request is kept so it takes effect if that
# ever changes; until then linux-toradex_%.bbappend adds pps-gpio to
# KERNEL_MODULE_AUTOLOAD, which loads it before sysinit.target and therefore
# before chronyd opens /dev/pps-gps.
CONFIG_PPS=y
CONFIG_PPS_CLIENT_GPIO=y
