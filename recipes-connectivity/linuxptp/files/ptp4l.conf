[global]
#
# Default Data Set
#
priority1               128
priority2               128
domainNumber            0
clockClass              248
clockAccuracy           0xFE
offsetScaledLogVariance 0xFFFF

#
# Port Data Set
#
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0
announceReceiptTimeout  3

#
# Run time options
#
time_stamping           hardware
tx_timestamp_timeout    10
summary_interval        0
use_syslog              1

#
# PTP master on ethernet1 (internal sensor network)
# Distributes system clock to radar/lidar devices
#
[ethernet1]

#
# Uncomment the section below to enable PTP on ethernet0
# (external network). Typical use cases:
#   - PTP slave: remove masterOnly to accept sync from upstream master
#   - PTP master: keep masterOnly 1 to serve time to external devices
#
# [ethernet0]
# masterOnly 1
