# Maivin GNSS time sources.
#
# SHM 0 (NMEA): coarse time from gpsd, accurate to roughly 200ms but
#   unambiguous -- it names the second.  Marked noselect because it exists
#   only to tell the PPS refclock which second each pulse belongs to.
#
# PPS (GPS): the GNSS TIMEPULSE on Verdin SODIMM 64 (GPIO3_IO16), captured by
#   the kernel pps-gpio driver.  Microsecond accurate, but a bare pulse cannot
#   say which second it is -- hence "lock NMEA".  /dev/pps-gps is a udev
#   symlink from meta-maivin, because the pps class numbering is not stable
#   across boots.
#
# maxlockage 10 keeps PPS samples usable when an NMEA sample is briefly late;
# without it chrony discards pulses whenever the locked source falls behind.

refclock SHM 0 refid NMEA delay 0.5 poll 0 noselect
refclock PPS /dev/pps-gps refid GPS lock NMEA maxlockage 10 precision 1e-7 poll 0 prefer
