# GPSD shared memory refclock
# SHM 0: NMEA time from GPS (accuracy ~100ms, used as fallback)
# SHM 1: PPS pulse (accuracy ~1us, preferred when available)
#
# refid: identifier shown in chronyc sources
# offset: compensate for known systematic delay
# delay: assumed network delay (high for NMEA, low for PPS)
# poll: polling interval as power of 2 (0 = 1s, 2 = 4s)
# noselect on SHM 0: use only for combining, not as sole source
#   (prevents selecting the low-accuracy NMEA time when NTP is available)

refclock SHM 0 refid NMEA offset 0.0 delay 0.2 poll 2 noselect
refclock SHM 1 refid PPS precision 1e-7 prefer poll 0
