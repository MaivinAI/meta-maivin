TDX_PRERELEASE ?= ""
TDX_MAJOR ?= "0"
TDX_MINOR ?= "0"
TDX_PATCH ?= "0"
TDX_RELEASE ?= "${TDX_MAJOR}.${TDX_MINOR}.${TDX_PATCH}"

require include/torizon.inc
require conf/distro/sota.conf.inc

DISTRO = "torizon-maivin"
DISTRO_NAME = "Torizon for Maivin"
DISTROOVERRIDES .= ":preempt-rt"

MAINTAINER = "Au-Zone Technologies <info@au-zone.com>"

PREFERRED_PROVIDER_virtual/dtb = "maivin-overlays"

# Pin flatbuffers to 23.x for compatibility with NXP tensorflow-lite 2.16.2
# (schema_generated.h asserts FLATBUFFERS_VERSION_MAJOR == 23)
PREFERRED_VERSION_flatbuffers ?= "23.5.26"
PREFERRED_VERSION_flatbuffers-native ?= "23.5.26"
PREFERRED_VERSION_python3-flatbuffers ?= "23.5.26"

# Toradex bbappend patches setup.cfg which no longer exists in urllib3 2.2.1
BBMASK += "/meta-toradex-torizon/recipes-devtools/python/python3-urllib3_%.bbappend"

# meta-updater valgrind patch missing Upstream-Status tag
BBMASK += "/meta-updater/recipes-devtools/valgrind/"

# videostream is now provided by meta-edgefirst
BBMASK += "/meta-deepview/recipes-visionpack/videostream/"
