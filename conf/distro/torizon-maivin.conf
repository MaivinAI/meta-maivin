TDX_PRERELEASE ?= ""
TDX_MAJOR ?= "0"
TDX_MINOR ?= "0"
TDX_PATCH ?= "0"
TDX_RELEASE ?= "${TDX_MAJOR}.${TDX_MINOR}.${TDX_PATCH}"

require conf/distro/include/torizon.inc
require conf/distro/sota.conf.inc

# Maivin needs Wayland/Vulkan/GL for the NXP GPU stack, unlike stock Torizon
# (base-distro.inc strips them by default). x11 stays stripped.
#
# "opengl" here is OE-core's umbrella GL/GLES rendering switch, not
# specifically desktop OpenGL — e.g. gstreamer1.0-plugins-base's imxgpu3d
# PACKAGECONFIG_GL override only selects "gles2 egl" when it's present, and
# desktop GL (virtual/libgl) is never pulled in on this machine class either
# way. Stripping "opengl" while keeping "wayland" leaves that recipe's GL
# platform/EGL support enabled with no GL API selected, so meson falls back
# to requiring desktop GL headers we don't have — hence also cancelling
# base-distro.inc's imx-generic-bsp-specific re-strip of "opengl" below.
DISTRO_FEATURES_REMOVE = "3g alsa irda pcmcia nfc ldconfig pulseaudio x11 ptest multiarch"
DISTRO_FEATURES_REMOVE:remove:imx-generic-bsp = "opengl"

DISTRO = "torizon-maivin"
DISTRO_NAME = "Torizon for Maivin"
DISTROOVERRIDES .= ":preempt-rt"

MAINTAINER = "Au-Zone Technologies <info@au-zone.com>"

PREFERRED_PROVIDER_virtual/dtb = "maivin-overlays"

# Pin flatbuffers to 23.x for compatibility with NXP tensorflow-lite 2.16.2
# (schema_generated.h asserts FLATBUFFERS_VERSION_MAJOR == 23)
PREFERRED_VERSION_flatbuffers ?= "23.5.26"
PREFERRED_VERSION_flatbuffers-native ?= "23.5.26"
PREFERRED_VERSION_python3-flatbuffers ?= "23.5.26"

# Toradex bbappend patches setup.cfg which no longer exists in urllib3 2.2.1
BBMASK += "/meta-toradex-torizon/recipes-devtools/python/python3-urllib3_%.bbappend"

# meta-updater valgrind patch missing Upstream-Status tag
BBMASK += "/meta-updater/recipes-devtools/valgrind/"

# meta-edgefirst bbappends targeting imx-machine-learning recipes not in our BSP
BBMASK += "/meta-edgefirst/recipes-foundation/tflite-vx-delegate/litert-vx-delegate"
BBMASK += "/meta-edgefirst/recipes-gstreamer/imx-nnstreamer-examples/"
BBMASK += "/meta-edgefirst/recipes-gstreamer/packagegroup/"

# u-boot-toradex_mainline.bb uses SRCREV = "${AUTOREV}", which forces a live
# `git ls-remote source.denx.de` at PARSE time for every build, regardless of
# whether it's ever selected (DEFAULT_PREFERENCE = "-1"; verdin-imx8mp uses
# u-boot-toradex_2024.07.bb). The recipe's own comment says not to use it for
# production. Mask it so parsing never depends on that server's availability.
BBMASK += "/meta-toradex-bsp-common/recipes-bsp/u-boot/u-boot-toradex_mainline.bb"

# Disable nnstreamer python3 support — numpy cross-compilation headers unavailable
# Disable nnstreamer query support — nnstreamer-edge API incompatibility (int vs size_t)
PACKAGECONFIG:remove:pn-nnstreamer = "python3 query"
