# Copy image defaults into /etc when OSTree's 3-way merge never created
# the file (units whose /etc lineage predates the /usr/etc copy).
# C is a no-op if the destination already exists, so this never clobbers a
# unit's intentional per-unit customization (e.g. a radarpub/lidarpub config
# set for a specific radar or LiDAR variant) -- factory-reset relies on this
# and does not touch /etc/default itself, see maivin-factory-reset.
d /media/DATA 0755 torizon torizon -
d /etc/ostree/remotes.d 0755 root root -
C /etc/ostree/remotes.d/maivin.conf - - - - /usr/etc/ostree/remotes.d/maivin.conf
C /etc/overlays.txt - - - - /usr/etc/overlays.txt
# The line above only ever seeds the maivin-2 (OS08A20) default this file
# ships in the image. A unit that's actually Maivin-1 (AR0521) hardware
# needs `sudo maivin-provision --fix --platform maivin-1` once to overwrite
# it -- see maivin-provision's --platform.
C /etc/default/camera - - - - /usr/etc/default/camera
C /etc/default/fusion - - - - /usr/etc/default/fusion
C /etc/default/lidarpub - - - - /usr/etc/default/lidarpub
C /etc/default/model - - - - /usr/etc/default/model
C /etc/default/radarpub - - - - /usr/etc/default/radarpub
C /etc/default/recorder - - - - /usr/etc/default/recorder
C /etc/default/replay - - - - /usr/etc/default/replay
C /etc/default/websrv - - - - /usr/etc/default/websrv
C /etc/default/zenohd - - - - /usr/etc/default/zenohd
C /etc/default/imu - - - - /usr/etc/default/imu
